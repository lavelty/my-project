<main id="main">
  <div class="pagehead">
    <div class="wrap">
      <p class="crumb"><a href="index.html">Ana sayfa</a> / Etkinlikler</p>

  </div>

    <div class="wrap">
      <div class="etabs" id="etabs" role="tablist" aria-label="Zaman"></div>

<script src="assets/js/chrome.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const keys=KF.TABS.map(t=>t[0]);
let tab=keys.includes(location.hash.slice(1))?location.hash.slice(1):'upcoming';
function render(){
  $('#etabs').innerHTML=KF.TABS.map(([k,l,f])=>`<button class="etab" role="tab" type="button" data-k="${k}" aria-selected="${k===tab}">${l}<em>${f().length}</em></button>`).join('');
  const list=KF.sortEv(KF.TABS.find(t=>t[0]===tab)[2]());
  $('#ecards').innerHTML=list.length?list.map(KF.cardHtml).join(''):`<div class="eempty"><p>${tab==='past'?'Geçmiş etkinlik yok':'Bu dönemde etkinlik yok'}</p>${tab==='upcoming'?'':'<button class="btn btn-dark" type="button" data-k="upcoming">Yaklaşan etkinlikleri gör</button>'}</div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;tab=b.dataset.k;history.replaceState(null,'','#'+tab);render()});
addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(keys.includes(k)){tab=k;render()}});
render();
})();
</script>
