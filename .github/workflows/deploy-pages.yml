name: Deploy Koru Florya to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate data and rebuild generated files
        run: node tools/build-data.mjs
      - name: Assemble site (site files only)
        run: |
          mkdir -p _site/assets
          cp *.html robots.txt sitemap.xml _site/
          for d in css js brands events logo og plans; do
            if [ -d "assets/$d" ]; then cp -r "assets/$d" _site/assets/; fi
          done
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
